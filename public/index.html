<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de Ganadores</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <main id="login" class="login"><section><p class="eyebrow">RIMAC × EFECTIBANK</p><h1>Gestión de ganadores</h1><p>Campaña Te queremos al 100</p><form id="loginForm"><label>DNI del colaborador<input id="loginDni" inputmode="numeric" maxlength="9" required autofocus></label><button>Ingresar</button><small>El DNI define si el acceso es de gestor o supervisor.</small><p id="loginError" class="error"></p></form></section></main>
  <main id="app" hidden>
    <header><div><p class="eyebrow">RIMAC × EFECTIBANK</p><h1>Gestión de ganadores</h1></div><div><span id="role"></span><button class="ghost" id="exportBtn" hidden>Exportar PRIX</button><button class="ghost" id="logoutBtn">Salir</button></div></header>
    <form id="searchForm" class="toolbar"><label for="search">Buscar ganador por DNI<input id="search" name="dni" type="text" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="8 dígitos"></label><button type="submit">Buscar</button><strong id="total"></strong></form>
    <p id="notice"></p><section class="layout"><aside><h2>Resultados</h2><div id="results"></div></aside><article id="detail"><p class="empty">Busca y selecciona un ganador para registrar la gestión.</p></article></section>
  </main>
  <script src="/app.js"></script>
</body></html>
